server {
    listen 80;
    listen [::]:80;
    server_name iam.avrig.ai;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iam.avrig.ai;

    ssl_certificate /etc/nginx/ssl/iam.avrig.ai.crt;
    ssl_certificate_key /etc/nginx/ssl/iam.avrig.ai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static custom avrig.ai theme assets
    location /custom/ {
        alias /var/www/iam-custom/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Intercept Rauthy default brand SVGs with avrig brand logo
    location = /auth/v1/assets/rauthy_dark.svg {
        alias /var/www/iam-custom/rauthy_dark.svg;
        add_header Content-Type image/svg+xml;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location = /auth/v1/assets/rauthy_light.svg {
        alias /var/www/iam-custom/rauthy_light.svg;
        add_header Content-Type image/svg+xml;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable compression upstream so sub_filter can parse HTML
        proxy_set_header Accept-Encoding "";

        # Sub filter to inject avrig.ai theme stylesheet and favicon
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="stylesheet" href="/custom/avrig-rauthy-theme.css"><link rel="icon" href="/custom/avrig-logo.svg"></head>';

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

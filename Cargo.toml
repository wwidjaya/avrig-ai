[workspace]
resolver = "2"
members = [
    "crates/avatar-runtime",
    "avatar/pet-desktop",
    "crates/avrig-harness",
    "crates/avrig-sdlc", "test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["avrig-ai"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"

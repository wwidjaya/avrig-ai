[package]
name = "avrig-desktop"
version = "0.1.0"
description = "avrig.ai Native Desktop Application"
edition = "2024"
license = "MIT"

[lib]
name = "avrig_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
